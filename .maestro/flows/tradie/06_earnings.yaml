appId: nz.co.fixo.fixo
---
# Flow 6 (Tradie): Earnings Summary — tr_earnings (Phase 5.7, screen id tr_earnings)
#
# Verifies: profile dock tab opens earnings screen (routed via /profile → earnings
# link or directly), and earnings summary cards are rendered.
# Screenshot captured for visual QA.

- launchApp:
    clearState: false

- runFlow:
    file: ../shared/login_tradie.yaml

# ── Navigate to Profile / Earnings via dock ───────────────────────────────────
- tapOn:
    id: "dock_profile"

# ── Look for an Earnings entry point (button or list tile) ───────────────────
- runFlow:
    when:
      visible: "Earnings"
    commands:
      - tapOn: "Earnings"
      - takeScreenshot: tr_earnings_light
      # Verify at least the page appeared (back nav lands back on profile)
      - pressKey: Back

- takeScreenshot: tr_profile_light

name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-build-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./backend
    - name: Build
      run: dotnet build --no-restore
      working-directory: ./backend
    - name: Test
      run: dotnet test --no-build --verbosity normal
      working-directory: ./backend

  mobile-build-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'
    - name: Install dependencies
      run: flutter pub get
      working-directory: ./mobile
    - name: Format check
      run: dart format --output=none --set-exit-if-changed lib test integration_test
      working-directory: ./mobile
    - name: Analyze project source
      run: flutter analyze --fatal-infos
      working-directory: ./mobile
    - name: Run tests
      run: flutter test
      working-directory: ./mobile

  design-system-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Design tokens, screens and WCAG contrast gate
      run: node docs/design/mobile/tools/build.mjs --check
    - name: Web design tokens, kit lint and WCAG contrast gate
      run: node docs/design/web/tools/build.mjs --check
    - name: Mockup PNGs are newer than mockups/index.html (P4-09)
      # Warn-only until the PNGs are re-exported once (writes png/source.json);
      # then drop --warn so a stale export fails the build.
      run: python3 scripts/check-mockup-pngs.py --warn

  web-build-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
      working-directory: ./web
    - name: Web design files match docs/design/web
      run: npm run design:check
      working-directory: ./web
    - name: No legacy design names
      run: npm run design:legacy
      working-directory: ./web
    - name: Lint
      run: npm run lint
      working-directory: ./web
    - name: Build
      run: npm run build
      working-directory: ./web

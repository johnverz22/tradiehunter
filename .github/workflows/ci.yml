name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-build-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./backend
    - name: Build
      run: dotnet build --no-restore
      working-directory: ./backend
    - name: Test
      run: dotnet test --no-build --verbosity normal
      working-directory: ./backend

  mobile-build-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'
    - name: Install dependencies
      run: flutter pub get
      working-directory: ./mobile
    - name: Analyze project source
      run: flutter analyze
      working-directory: ./mobile
    - name: Run tests
      run: flutter test
      working-directory: ./mobile

  web-build-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
      working-directory: ./web
    - name: Lint
      run: npm run lint
      working-directory: ./web
    - name: Build
      run: npm run build
      working-directory: ./web

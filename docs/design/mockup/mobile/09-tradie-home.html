<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixo - Tradie Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --hue: 209;
    --brand-900: hsl(var(--hue) 55% 22%);
    --brand-700: hsl(var(--hue) 50% 32%);
    --brand-500: hsl(var(--hue) 48% 45%);
    --brand-300: hsl(var(--hue) 45% 68%);
    --brand-100: hsl(var(--hue) 45% 92%);
    --amber: #E38B29;
    --red: #B23A2E;
    --green: #3A7D5C;
    --paper: #F6F4EE;
    --ink: #1D2226;
    --white: #FFFFFF;
    --radius: 4px;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'IBM Plex Sans', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14181B;
      --ink: #ECEAE3;
      --white: #1E2328;
      --brand-100: hsl(var(--hue) 35% 16%);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e5e5e5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: var(--font-body);
  }
  .phone-frame {
    width: 375px;
    height: 812px;
    background: var(--paper);
    border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .app-bar {
    padding: 48px 24px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .wordmark {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    color: var(--brand-900);
  }
  .wordmark span { color: var(--amber); }
  .status-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--green);
  }
  .toggle-switch {
    width: 44px;
    height: 24px;
    background: var(--green);
    border-radius: 12px;
    position: relative;
  }
  .toggle-switch::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    background: white;
    border-radius: 50%;
    top: 2px;
    right: 2px;
  }
  .content {
    flex: 1;
    padding: 0 24px 100px;
    overflow-y: auto;
  }
  .greeting {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    color: var(--ink);
    margin-bottom: 24px;
  }
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .stat-label {
    font-size: 12px;
    color: var(--ink);
    opacity: 0.6;
    margin-bottom: 4px;
  }
  .stat-value {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 20px;
    color: var(--ink);
  }
  .section-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 18px;
    color: var(--ink);
    margin-bottom: 16px;
  }
  .request-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .request-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .request-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
  }
  .badge-urgent {
    background: var(--red);
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 2px;
  }
  .request-location {
    font-size: 13px;
    color: var(--ink);
    opacity: 0.7;
    margin-bottom: 8px;
  }
  .request-meta {
    font-size: 12px;
    color: var(--ink);
    opacity: 0.5;
  }
  .job-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .job-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .job-meta {
    font-size: 13px;
    color: var(--ink);
    opacity: 0.6;
  }
  .bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 64px;
    background: var(--white);
    border-top: 1px solid var(--brand-100);
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--ink);
    opacity: 0.5;
  }
  .nav-item.active {
    color: var(--brand-500);
    opacity: 1;
  }
  .nav-icon {
    width: 24px;
    height: 24px;
    background: currentColor;
    mask-size: contain;
    mask-repeat: no-repeat;
    mask-position: center;
    -webkit-mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-position: center;
  }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="app-bar">
      <div class="wordmark">Fixo<span>.</span></div>
      <div class="status-toggle">
        Online
        <div class="toggle-switch"></div>
      </div>
    </div>
    
    <div class="content">
      <div class="greeting">Hey James,</div>
      
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">Jobs</div>
          <div class="stat-value">42</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Rating</div>
          <div class="stat-value">4.8</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Response</div>
          <div class="stat-value">95%</div>
        </div>
      </div>
      
      <div class="section-title">Incoming Requests</div>
      <div class="request-card">
        <div class="request-header">
          <div class="request-title">Emergency Pipe Burst</div>
          <div class="badge-urgent">URGENT</div>
        </div>
        <div class="request-location">Ponsonby (3.5 km)</div>
        <div class="request-meta">Requested by Sarah H. • 5 mins ago</div>
      </div>
      
      <div class="section-title">Active Jobs</div>
      <div class="job-card">
        <div class="job-title">Install shower head</div>
        <div class="job-meta">Mt Eden • Confirmed</div>
      </div>
    </div>
    
    <div class="bottom-nav">
      <div class="nav-item active">
        <div class="nav-icon" style="mask-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><path d=%22M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z%22/></svg>'); -webkit-mask-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><path d=%22M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z%22/></svg>');"></div>
        Dashboard
      </div>
      <div class="nav-item">
        <div class="nav-icon" style="mask-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><path d=%22M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 16H4V8h16v12z%22/></svg>'); -webkit-mask-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><path d=%22M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 16H4V8h16v12z%22/></svg>');"></div>
        Jobs
      </div>
      <div class="nav-item">
        <div class="nav-icon" style="mask-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><path d=%22M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z%22/></svg>'); -webkit-mask-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><path d=%22M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z%22/></svg>');"></div>
        Messages
      </div>
      <div class="nav-item">
        <div class="nav-icon" style="mask-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><path d=%22M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z%22/></svg>'); -webkit-mask-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><path d=%22M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z%22/></svg>');"></div>
        Profile
      </div>
    </div>
  </div>
</body>
</html>

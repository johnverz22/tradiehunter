<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradieFixo - Incoming Request Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --hue: 209;
    --brand-900: hsl(var(--hue) 55% 22%);
    --brand-700: hsl(var(--hue) 50% 32%);
    --brand-500: hsl(var(--hue) 48% 45%);
    --brand-300: hsl(var(--hue) 45% 68%);
    --brand-100: hsl(var(--hue) 45% 92%);
    --amber: #E38B29;
    --red: #B23A2E;
    --paper: #F6F4EE;
    --ink: #1D2226;
    --white: #FFFFFF;
    --radius: 4px;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14181B;
      --ink: #ECEAE3;
      --white: #1E2328;
      --brand-100: hsl(var(--hue) 35% 16%);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e5e5e5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: var(--font-body);
  }
  .phone-frame {
    width: 375px;
    height: 812px;
    background: var(--paper);
    border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .app-bar {
    padding: 48px 24px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--brand-100);
  }
  .back-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    font-size: 20px;
    cursor: pointer;
  }
  .app-bar h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    color: var(--ink);
  }
  .content {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 100px;
  }
  .map-placeholder {
    width: 100%;
    height: 150px;
    background: var(--brand-100);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--brand-500);
    font-size: 14px;
  }
  .details {
    padding: 24px;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }
  h2 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    color: var(--ink);
  }
  .badge-urgent {
    background: var(--red);
    color: white;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 2px;
  }
  .info-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--brand-100);
  }
  .info-item {
    text-align: center;
  }
  .info-label {
    font-size: 12px;
    color: var(--ink);
    opacity: 0.6;
    margin-bottom: 4px;
  }
  .info-value {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }
  .section-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .description {
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
    margin-bottom: 24px;
  }
  .photos-scroll {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 8px;
  }
  .photo-placeholder {
    width: 120px;
    height: 90px;
    background: var(--brand-100);
    border-radius: var(--radius);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--brand-500);
  }
  .bottom-action {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 16px 24px;
    background: var(--white);
    box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
    display: flex;
    gap: 12px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .btn-ghost {
    flex: 1;
    background: transparent;
    border: 1px solid var(--brand-100);
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15px;
    height: 48px;
    border-radius: var(--radius);
    cursor: pointer;
  }
  .btn-primary {
    flex: 2;
    background: var(--amber);
    color: white;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 16px;
    height: 48px;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="app-bar">
      <div class="back-btn">←</div>
      <h1>Job Request</h1>
    </div>
    
    <div class="content">
      <div class="map-placeholder">📍 Map View - Ponsonby, Auckland</div>
      
      <div class="details">
        <div class="header-row">
          <h2>Emergency Pipe Burst</h2>
          <div class="badge-urgent">URGENT</div>
        </div>
        
        <div class="info-grid">
          <div class="info-item">
            <div class="info-label">Distance</div>
            <div class="info-value">3.5 km</div>
          </div>
          <div class="info-item">
            <div class="info-label">Client</div>
            <div class="info-value">Sarah H. (★ 5.0)</div>
          </div>
          <div class="info-item">
            <div class="info-label">Posted</div>
            <div class="info-value">10 mins ago</div>
          </div>
        </div>
        
        <div class="section-title">Description</div>
        <div class="description">
          Kitchen sink pipe has burst and water is leaking onto the floor. Need someone ASAP to cap it or fix it.
        </div>
        
        <div class="section-title">Photos</div>
        <div class="photos-scroll">
          <div class="photo-placeholder">Wet floor</div>
          <div class="photo-placeholder">Pipes under sink</div>
        </div>
      </div>
    </div>
    
    <div class="bottom-action">
      <button class="btn-ghost">Decline</button>
      <button class="btn-primary">Accept Job</button>
    </div>
  </div>
</body>
</html>

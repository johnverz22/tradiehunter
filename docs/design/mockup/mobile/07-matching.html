<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixo - Matching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --hue: 209;
    --brand-900: hsl(var(--hue) 55% 22%);
    --brand-700: hsl(var(--hue) 50% 32%);
    --brand-500: hsl(var(--hue) 48% 45%);
    --brand-300: hsl(var(--hue) 45% 68%);
    --brand-100: hsl(var(--hue) 45% 92%);
    --amber: #E38B29;
    --paper: #F6F4EE;
    --ink: #1D2226;
    --radius: 4px;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14181B;
      --ink: #ECEAE3;
      --brand-100: hsl(var(--hue) 35% 16%);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e5e5e5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: var(--font-body);
  }
  .phone-frame {
    width: 375px;
    height: 812px;
    background: var(--paper);
    border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .radar-container {
    position: relative;
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 48px;
  }
  .ripple {
    position: absolute;
    border-radius: 50%;
    border: 2px solid var(--brand-100);
    animation: ripple 2s ease-out infinite;
  }
  .ripple:nth-child(1) {
    width: 60px;
    height: 60px;
    animation-delay: 0s;
  }
  .ripple:nth-child(2) {
    width: 120px;
    height: 120px;
    animation-delay: 0.4s;
  }
  .ripple:nth-child(3) {
    width: 180px;
    height: 180px;
    animation-delay: 0.8s;
  }
  @keyframes ripple {
    0% {
      transform: scale(0.8);
      opacity: 1;
      border-color: var(--brand-500);
    }
    100% {
      transform: scale(1.2);
      opacity: 0;
      border-color: var(--brand-100);
    }
  }
  .center-icon {
    width: 48px;
    height: 48px;
    background: var(--brand-500);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 24px;
    z-index: 1;
  }
  .text-content {
    text-align: center;
    padding: 0 24px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 14px;
    color: var(--ink);
    opacity: 0.6;
  }
  .cancel-btn {
    position: absolute;
    bottom: 48px;
    background: transparent;
    border: none;
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 15px;
    padding: 12px 24px;
    cursor: pointer;
    opacity: 0.7;
  }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="radar-container">
      <div class="ripple"></div>
      <div class="ripple"></div>
      <div class="ripple"></div>
      <div class="center-icon">🔍</div>
    </div>
    
    <div class="text-content">
      <h1>Finding tradies near you...</h1>
      <div class="subtitle">Plumbing • Urgent • Grey Lynn</div>
    </div>
    
    <button class="cancel-btn">Cancel</button>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixo - Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --hue: 209;
    --brand-900: hsl(var(--hue) 55% 22%);
    --brand-700: hsl(var(--hue) 50% 32%);
    --brand-500: hsl(var(--hue) 48% 45%);
    --brand-300: hsl(var(--hue) 45% 68%);
    --brand-100: hsl(var(--hue) 45% 92%);
    --amber: #E38B29;
    --paper: #F6F4EE;
    --ink: #1D2226;
    --radius: 4px;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14181B;
      --ink: #ECEAE3;
      --brand-100: hsl(var(--hue) 35% 16%);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e5e5e5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: var(--font-body);
  }
  .phone-frame {
    width: 375px;
    height: 812px;
    background: var(--paper);
    border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-y: auto;
  }
  .header {
    padding: 48px 24px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .back-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    font-size: 20px;
    cursor: pointer;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    color: var(--ink);
  }
  h1 span { color: var(--amber); }
  .content {
    padding: 0 24px 24px;
    flex: 1;
  }
  .role-selector {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 32px;
  }
  .role-card {
    padding: 16px;
    border: 2px solid var(--brand-100);
    border-radius: var(--radius);
    text-align: center;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.2s;
  }
  .role-card.selected {
    border-color: var(--amber);
    background: rgba(227, 139, 41, 0.1);
    color: var(--amber);
  }
  .form-group {
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 8px;
  }
  input {
    width: 100%;
    height: 48px;
    padding: 0 16px;
    font-family: var(--font-body);
    font-size: 16px;
    border: 1px solid var(--brand-100);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
  }
  input:focus {
    outline: 2px solid var(--brand-500);
    outline-offset: 2px;
  }
  .btn-primary {
    background: var(--amber);
    color: white;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 16px;
    height: 48px;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    width: 100%;
    margin-top: 8px;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 32px 0;
    color: var(--ink);
    opacity: 0.5;
    font-size: 13px;
  }
  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--brand-100);
  }
  .btn-google {
    background: white;
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 16px;
    height: 48px;
    border: 1px solid var(--brand-100);
    border-radius: var(--radius);
    cursor: pointer;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .google-icon {
    width: 20px;
    height: 20px;
    background: #4285F4;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 700;
    font-size: 12px;
  }
  .footer {
    margin-top: auto;
    text-align: center;
    font-size: 14px;
    color: var(--ink);
    opacity: 0.7;
    padding-top: 24px;
  }
  .footer a {
    color: var(--brand-500);
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="header">
      <div class="back-btn">←</div>
      <h1>Join Fixo<span>.</span></h1>
    </div>
    
    <div class="content">
      <div class="role-selector">
        <div class="role-card selected">I'm a Homeowner</div>
        <div class="role-card">I'm a Tradie</div>
      </div>
      
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Jane Doe">
      </div>
      
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="jane@example.co.nz">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="">
      </div>
      
      <button class="btn-primary">Create account</button>
      
      <div class="divider">or sign up with</div>
      
      <button class="btn-google">
        <div class="google-icon">G</div>
        Google
      </button>
      
      <div class="footer">
        Already have an account? <a href="03-login.html">Log in</a>
      </div>
    </div>
  </div>
</body>
</html>

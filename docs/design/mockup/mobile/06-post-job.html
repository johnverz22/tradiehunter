<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradieFixo - Post a Job</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --hue: 209;
    --brand-900: hsl(var(--hue) 55% 22%);
    --brand-700: hsl(var(--hue) 50% 32%);
    --brand-500: hsl(var(--hue) 48% 45%);
    --brand-300: hsl(var(--hue) 45% 68%);
    --brand-100: hsl(var(--hue) 45% 92%);
    --amber: #E38B29;
    --red: #B23A2E;
    --paper: #F6F4EE;
    --ink: #1D2226;
    --radius: 4px;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14181B;
      --ink: #ECEAE3;
      --brand-100: hsl(var(--hue) 35% 16%);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e5e5e5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: var(--font-body);
  }
  .phone-frame {
    width: 375px;
    height: 812px;
    background: var(--paper);
    border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .app-bar {
    padding: 48px 24px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--brand-100);
  }
  .back-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    font-size: 20px;
    cursor: pointer;
  }
  .app-bar h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    color: var(--ink);
  }
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    padding-bottom: 100px;
  }
  .section {
    margin-bottom: 32px;
  }
  .section-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    padding: 8px 16px;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid var(--brand-100);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .chip.selected {
    background: var(--brand-500);
    color: white;
    border-color: var(--brand-500);
  }
  textarea {
    width: 100%;
    height: 120px;
    padding: 16px;
    font-family: var(--font-body);
    font-size: 15px;
    border: 1px solid var(--brand-100);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
    resize: none;
  }
  textarea:focus {
    outline: 2px solid var(--brand-500);
    outline-offset: 2px;
  }
  .dropzone {
    border: 2px dashed var(--brand-100);
    border-radius: var(--radius);
    padding: 32px;
    text-align: center;
    color: var(--ink);
    opacity: 0.6;
    cursor: pointer;
  }
  .dropzone-icon {
    font-size: 32px;
    margin-bottom: 8px;
  }
  .urgency-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .urgency-card {
    padding: 16px;
    border: 2px solid var(--brand-100);
    border-radius: var(--radius);
    text-align: center;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
  }
  .urgency-card.selected {
    border-color: var(--amber);
    background: rgba(227, 139, 41, 0.1);
    color: var(--amber);
  }
  input {
    width: 100%;
    height: 48px;
    padding: 0 16px;
    font-family: var(--font-body);
    font-size: 15px;
    border: 1px solid var(--brand-100);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
  }
  input:focus {
    outline: 2px solid var(--brand-500);
    outline-offset: 2px;
  }
  .bottom-action {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 16px 24px;
    background: var(--paper);
    box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .btn-primary {
    background: var(--amber);
    color: white;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 16px;
    height: 48px;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    width: 100%;
  }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="app-bar">
      <div class="back-btn">←</div>
      <h1>Post a Job</h1>
    </div>
    
    <div class="content">
      <div class="section">
        <div class="section-title">What do you need?</div>
        <div class="chips">
          <div class="chip selected">Plumbing</div>
          <div class="chip">Electrical</div>
          <div class="chip">Painting</div>
          <div class="chip">Carpentry</div>
          <div class="chip">General</div>
          <div class="chip">Other</div>
        </div>
      </div>
      
      <div class="section">
        <div class="section-title">Describe the issue</div>
        <textarea placeholder="E.g., The pipe under the kitchen sink is leaking heavily..."></textarea>
      </div>
      
      <div class="section">
        <div class="section-title">Photos (Optional)</div>
        <div class="dropzone">
          <div class="dropzone-icon">📷</div>
          <div>Tap to add photos</div>
        </div>
      </div>
      
      <div class="section">
        <div class="section-title">Urgency</div>
        <div class="urgency-options">
          <div class="urgency-card selected">Normal (Whenever)</div>
          <div class="urgency-card">Urgent (ASAP)</div>
        </div>
      </div>
      
      <div class="section">
        <div class="section-title">Location</div>
        <input type="text" value="Grey Lynn, Auckland" placeholder="Enter your location">
      </div>
    </div>
    
    <div class="bottom-action">
      <button class="btn-primary">Post Job</button>
    </div>
  </div>
</body>
</html>

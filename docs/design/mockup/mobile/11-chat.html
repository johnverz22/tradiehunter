<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradieFixo - Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --hue: 209;
    --brand-900: hsl(var(--hue) 55% 22%);
    --brand-700: hsl(var(--hue) 50% 32%);
    --brand-500: hsl(var(--hue) 48% 45%);
    --brand-300: hsl(var(--hue) 45% 68%);
    --brand-100: hsl(var(--hue) 45% 92%);
    --amber: #E38B29;
    --green: #3A7D5C;
    --paper: #F6F4EE;
    --ink: #1D2226;
    --white: #FFFFFF;
    --radius: 4px;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14181B;
      --ink: #ECEAE3;
      --white: #1E2328;
      --brand-100: hsl(var(--hue) 35% 16%);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e5e5e5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: var(--font-body);
  }
  .phone-frame {
    width: 375px;
    height: 812px;
    background: var(--paper);
    border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .header {
    padding: 48px 24px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--brand-100);
  }
  .back-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    font-size: 20px;
    cursor: pointer;
  }
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--brand-500);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16px;
  }
  .header-info {
    flex: 1;
  }
  .header-name {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
  }
  .header-role {
    font-size: 13px;
    color: var(--ink);
    opacity: 0.6;
  }
  .phone-icon {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--brand-500);
    font-size: 18px;
    cursor: pointer;
  }
  .stepper {
    display: flex;
    align-items: center;
    padding: 16px 24px;
    background: var(--white);
    border-bottom: 1px solid var(--brand-100);
  }
  .step {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  .step-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--brand-100);
    border: 2px solid var(--brand-100);
    z-index: 1;
  }
  .step.done .step-dot {
    background: var(--brand-700);
    border-color: var(--brand-700);
  }
  .step.active .step-dot {
    background: var(--green);
    border-color: var(--green);
  }
  .step-line {
    position: absolute;
    top: 6px;
    left: 50%;
    width: 100%;
    height: 2px;
    background: var(--brand-100);
    z-index: 0;
  }
  .step.done .step-line {
    background: var(--brand-700);
  }
  .step-label {
    font-size: 10px;
    color: var(--ink);
    opacity: 0.5;
    margin-top: 6px;
  }
  .step.active .step-label {
    opacity: 1;
    font-weight: 600;
    color: var(--green);
  }
  .chat-area {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
  }
  .time-separator {
    text-align: center;
    font-size: 12px;
    color: var(--ink);
    opacity: 0.5;
    margin-bottom: 16px;
  }
  .message {
    max-width: 80%;
    padding: 12px 16px;
    margin-bottom: 12px;
    font-size: 15px;
    line-height: 1.4;
  }
  .message.received {
    background: var(--brand-100);
    color: var(--ink);
    border-radius: 4px 16px 16px 16px;
    align-self: flex-start;
  }
  .message.sent {
    background: var(--brand-900);
    color: white;
    border-radius: 16px 4px 16px 16px;
    margin-left: auto;
  }
  .input-area {
    padding: 16px 24px;
    background: var(--white);
    border-top: 1px solid var(--brand-100);
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .attach-btn {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    opacity: 0.6;
    font-size: 18px;
    cursor: pointer;
  }
  .input-field {
    flex: 1;
    height: 40px;
    padding: 0 16px;
    background: var(--paper);
    border: 1px solid var(--brand-100);
    border-radius: 20px;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--ink);
  }
  .input-field:focus {
    outline: 2px solid var(--brand-500);
    outline-offset: 2px;
  }
  .send-btn {
    width: 36px;
    height: 36px;
    background: var(--amber);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="header">
      <div class="back-btn">←</div>
      <div class="avatar">D</div>
      <div class="header-info">
        <div class="header-name">David</div>
        <div class="header-role">Plumber</div>
      </div>
      <div class="phone-icon">📞</div>
    </div>
    
    <div class="stepper">
      <div class="step done">
        <div class="step-line"></div>
        <div class="step-dot"></div>
        <div class="step-label">Requested</div>
      </div>
      <div class="step done">
        <div class="step-line"></div>
        <div class="step-dot"></div>
        <div class="step-label">Matched</div>
      </div>
      <div class="step active">
        <div class="step-line"></div>
        <div class="step-dot"></div>
        <div class="step-label">Confirmed</div>
      </div>
      <div class="step">
        <div class="step-line"></div>
        <div class="step-dot"></div>
        <div class="step-label">Complete</div>
      </div>
    </div>
    
    <div class="chat-area">
      <div class="time-separator">Today 2:14 PM</div>
      <div class="message received">Kia ora Sarah, I'm about 15 minutes away.</div>
      <div class="message sent">Great, see you soon. Driveway is on the left.</div>
    </div>
    
    <div class="input-area">
      <div class="attach-btn">📷</div>
      <input type="text" class="input-field" placeholder="Type a message...">
      <div class="send-btn">➤</div>
    </div>
  </div>
</body>
</html>

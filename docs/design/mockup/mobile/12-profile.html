<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixo - Tradie Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --hue: 209;
    --brand-900: hsl(var(--hue) 55% 22%);
    --brand-700: hsl(var(--hue) 50% 32%);
    --brand-500: hsl(var(--hue) 48% 45%);
    --brand-300: hsl(var(--hue) 45% 68%);
    --brand-100: hsl(var(--hue) 45% 92%);
    --amber: #E38B29;
    --green: #3A7D5C;
    --paper: #F6F4EE;
    --ink: #1D2226;
    --white: #FFFFFF;
    --radius: 4px;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14181B;
      --ink: #ECEAE3;
      --white: #1E2328;
      --brand-100: hsl(var(--hue) 35% 16%);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e5e5e5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: var(--font-body);
  }
  .phone-frame {
    width: 375px;
    height: 812px;
    background: var(--paper);
    border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-y: auto;
  }
  .header {
    padding: 48px 24px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .back-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    font-size: 20px;
    cursor: pointer;
  }
  .header h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    color: var(--ink);
  }
  .content {
    padding: 0 24px 24px;
  }
  .profile-top {
    text-align: center;
    margin-bottom: 32px;
  }
  .avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--brand-500);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 32px;
    margin: 0 auto 16px;
  }
  .name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .trade {
    font-size: 15px;
    color: var(--ink);
    opacity: 0.7;
    margin-bottom: 12px;
  }
  .badges {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 100px;
  }
  .badge-verified {
    background: rgba(58, 125, 92, 0.15);
    color: var(--green);
  }
  .badge-member {
    background: var(--brand-100);
    color: var(--ink);
    opacity: 0.7;
  }
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-item {
    text-align: center;
    padding: 16px 8px;
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .stat-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .stat-value span {
    color: var(--amber);
  }
  .stat-label {
    font-size: 11px;
    color: var(--ink);
    opacity: 0.6;
  }
  .btn-ghost {
    width: 100%;
    background: transparent;
    border: 1px solid var(--brand-100);
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15px;
    height: 48px;
    border-radius: var(--radius);
    cursor: pointer;
    margin-bottom: 32px;
  }
  .section-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 18px;
    color: var(--ink);
    margin-bottom: 16px;
  }
  .review-item {
    background: var(--white);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .review-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .reviewer-name {
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
  }
  .review-date {
    font-size: 12px;
    color: var(--ink);
    opacity: 0.5;
  }
  .stars {
    color: var(--amber);
    font-size: 14px;
    margin-bottom: 8px;
  }
  .review-text {
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    opacity: 0.8;
  }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="header">
      <div class="back-btn">←</div>
      <h1>Profile</h1>
    </div>
    
    <div class="content">
      <div class="profile-top">
        <div class="avatar">DW</div>
        <div class="name">David Wiremu</div>
        <div class="trade">Master Plumber</div>
        <div class="badges">
          <div class="badge badge-verified">✓ Verified</div>
          <div class="badge badge-member">Member since 2023</div>
        </div>
      </div>
      
      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-value"><span>★ 4.9</span></div>
          <div class="stat-label">124 reviews</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">150+</div>
          <div class="stat-label">Jobs</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">100%</div>
          <div class="stat-label">Response</div>
        </div>
      </div>
      
      <button class="btn-ghost">Edit Profile</button>
      
      <div class="section-title">Recent Reviews</div>
      
      <div class="review-item">
        <div class="review-header">
          <div class="reviewer-name">Michael T.</div>
          <div class="review-date">2 days ago</div>
        </div>
        <div class="stars">★★★★★</div>
        <div class="review-text">Fast, professional, and sorted the leak in no time. Highly recommend.</div>
      </div>
      
      <div class="review-item">
        <div class="review-header">
          <div class="reviewer-name">Emma J.</div>
          <div class="review-date">1 week ago</div>
        </div>
        <div class="stars">★★★★★</div>
        <div class="review-text">Great comms and arrived on time.</div>
      </div>
    </div>
  </div>
</body>
</html>

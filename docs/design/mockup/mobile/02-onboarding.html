<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixo - Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --hue: 209;
    --brand-900: hsl(var(--hue) 55% 22%);
    --brand-700: hsl(var(--hue) 50% 32%);
    --brand-500: hsl(var(--hue) 48% 45%);
    --brand-300: hsl(var(--hue) 45% 68%);
    --brand-100: hsl(var(--hue) 45% 92%);
    --amber: #E38B29;
    --paper: #F6F4EE;
    --ink: #1D2226;
    --radius: 4px;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14181B;
      --ink: #ECEAE3;
      --brand-100: hsl(var(--hue) 35% 16%);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e5e5e5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: var(--font-body);
  }
  .phone-frame {
    width: 375px;
    height: 812px;
    background: var(--paper);
    border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .header {
    padding: 48px 24px 16px;
  }
  .wordmark {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    color: var(--brand-900);
  }
  .wordmark span { color: var(--amber); }
  .illustration {
    flex: 1;
    margin: 0 24px;
    background: var(--brand-100);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .illustration-placeholder {
    font-family: var(--font-mono, monospace);
    color: var(--brand-500);
    font-size: 14px;
    opacity: 0.6;
  }
  .content {
    padding: 32px 24px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    color: var(--ink);
    margin-bottom: 16px;
  }
  p {
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--ink);
    line-height: 1.5;
    opacity: 0.8;
  }
  .dots {
    display: flex;
    gap: 8px;
    margin-top: 32px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--brand-100);
  }
  .dot.active {
    background: var(--amber);
  }
  .actions {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .btn-primary {
    background: var(--amber);
    color: white;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 16px;
    height: 48px;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    width: 100%;
  }
  .btn-ghost {
    background: transparent;
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 14px;
    border: none;
    cursor: pointer;
    padding: 12px;
  }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="header">
      <div class="wordmark">Fixo<span>.</span></div>
    </div>
    <div class="illustration">
      <div class="illustration-placeholder">Illustration Area</div>
    </div>
    <div class="content">
      <h1>Describe your problem</h1>
      <p>Tell us what needs fixing and we'll connect you with the right local professionals.</p>
      <div class="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn-primary">Next</button>
      <button class="btn-ghost">Skip</button>
    </div>
  </div>
</body>
</html>

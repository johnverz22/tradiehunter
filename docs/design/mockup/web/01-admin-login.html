<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradieFixo Admin - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --hue: 209;
    --brand-900: hsl(var(--hue) 55% 22%);
    --brand-700: hsl(var(--hue) 50% 32%);
    --brand-500: hsl(var(--hue) 48% 45%);
    --brand-300: hsl(var(--hue) 45% 68%);
    --brand-100: hsl(var(--hue) 45% 92%);
    --amber: #E38B29;
    --paper: #F6F4EE;
    --ink: #1D2226;
    --white: #FFFFFF;
    --radius: 4px;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14181B;
      --ink: #ECEAE3;
      --white: #1E2328;
      --brand-100: hsl(var(--hue) 35% 16%);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
  }
  .login-container {
    width: 100%;
    max-width: 400px;
    padding: 48px;
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .wordmark {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 32px;
    color: var(--brand-900);
    margin-bottom: 8px;
  }
  .wordmark span { color: var(--amber); }
  .subtitle {
    font-size: 14px;
    color: var(--ink);
    opacity: 0.6;
    margin-bottom: 32px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    margin-bottom: 24px;
  }
  .form-group {
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 8px;
  }
  input {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    font-family: var(--font-body);
    font-size: 15px;
    border: 1px solid var(--brand-100);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
  }
  input:focus {
    outline: 2px solid var(--brand-500);
    outline-offset: 2px;
  }
  .btn-primary {
    width: 100%;
    height: 44px;
    background: var(--brand-700);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn-primary:hover {
    background: var(--brand-900);
  }
</style>
</head>
<body>
  <div class="login-container">
    <div class="wordmark">Tradie<span>Fixo</span></div>
    <div class="subtitle">Admin Dashboard</div>
    <h1>Sign in</h1>
    
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="admin@fixo.co.nz">
    </div>
    
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="">
    </div>
    
    <button class="btn-primary">Sign in</button>
  </div>
</body>
</html>

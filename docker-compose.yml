# Fixo — Local Development Stack (OrbStack / Docker Desktop)
# Usage: docker compose up -d
# Docs:  docs/ARCHITECTURE.md

services:
  # ─── Data stores ──────────────────────────────────────────────

  db:
    image: sogis/postgis:16-3.4
    container_name: fixo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fixo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fixo_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fixo}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fixo}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fixo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Azurite emulates Azure Blob Storage locally (API at :10000).
  # Containers are created lazily by the API on first upload — no init step.
  # Inspect blobs with Azure Storage Explorer → "Attach to a local emulator".
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: fixo-azurite
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
    volumes:
      - azuritedata:/data

  # ─── Application services ────────────────────────────────────

  # P1-02: local SMTP catcher for OTP + staff-invite emails.
  # UI: http://localhost:8025 · SMTP: localhost:1025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: fixo-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fixo-api
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${API_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-fixo};Username=${POSTGRES_USER:-fixo};Password=${POSTGRES_PASSWORD:-fixo_dev}"
      Jwt__Secret: ${JWT_SECRET:-GOCSPX-VOkvwdTNIZ3|0_5KTg|0cbVVmvzg}
      ConnectionStrings__Redis: "redis:6379"
      AzureBlob__ServiceUrl: "http://azurite:10000"
      AzureBlob__ExternalServiceUrl: "http://localhost:10000"
      AzureBlob__AccountName: "devstoreaccount1"
      AzureBlob__AccountKey: "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
      AzureBlob__PhotosContainer: "fixo-photos"
      AzureBlob__CredentialsContainer: "fixo-credentials"
      Locale__DefaultCurrency: "NZD"
      Locale__CurrencySymbol: "$"
      Locale__PhoneCountryCode: "+64"
      Locale__DefaultTimezone: "Pacific/Auckland"
      Locale__DistanceUnit: "km"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-service-account.json
      AddressResolution__Provider: ${ADDRESS_RESOLUTION_PROVIDER:-Linz}
      AddressResolution__Linz__ApiKey: ${LINZ_API_KEY:-}
      AddressResolution__Linz__LayerId: ${LINZ_ADDRESS_LAYER_ID:-123113}
      EmailSender__Host: "mailhog"
      EmailSender__Port: "1025"
      EmailSender__FromEmail: "noreply@fixo.nz"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_started
    volumes:
      - ./backend:/app   # mount source for hot reload (dev)
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: fixo-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      VITE_API_URL: "http://localhost:${API_PORT:-5000}/api"
      VITE_SIGNALR_URL: "http://localhost:${API_PORT:-5000}/hubs"
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-REPLACE_WITH_WEB_CLIENT_ID.apps.googleusercontent.com}
    depends_on:
      - api
    volumes:
      - ./web:/app       # mount source for hot reload (dev)
      - /app/node_modules # anonymous volume: keep container (linux/musl) deps, don't clobber with host (macOS) node_modules

volumes:
  pgdata:
    name: fixo-pgdata
  redisdata:
    name: fixo-redisdata
  azuritedata:
    name: fixo-azuritedata

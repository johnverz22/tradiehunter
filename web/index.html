<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#1E3A8A" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TradieHunter Admin — marketplace operations dashboard" />
    <meta name="theme-color" content="#1E3A8A" />
    <!-- Self-hosted fonts (Lexend + Source Sans 3), synced from docs/design/web/fonts -->
    <link rel="preload" href="/fonts/lexend-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/source-sans-3-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>TradieHunter Admin</title>
    <!-- Blocking theme init: must run before first paint to prevent FOUC.
         Sets data-theme from localStorage, falling back to OS preference. -->
    <script>
      (function () {
        var stored =
          localStorage.getItem('tradiehunter-theme') || localStorage.getItem('fixo-theme');
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
